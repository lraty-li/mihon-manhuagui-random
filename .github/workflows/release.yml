name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version tag
        shell: bash
        run: |
          set -euo pipefail
          build_file="src/zh/manhuagui/build.gradle.kts"
          lib_version="$(sed -nE 's/^[[:space:]]*libVersion = "([0-9]+[.][0-9]+)"/\1/p' "$build_file" | head -n 1)"
          patch_version="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' "$build_file" | head -n 1)"
          [[ -n "$lib_version" && -n "$patch_version" ]] || { echo "Could not read extension version"; exit 1; }
          expected_tag="v${lib_version}.${patch_version}"
          [[ "$GITHUB_REF_NAME" == "$expected_tag" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match APK version $expected_tag"
            exit 1
          }

      - name: Restore dedicated signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEYSTORE_BASE64" ]] || { echo "Missing SIGNING_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signingkey.jks
          [[ -s signingkey.jks ]] || { echo "Invalid signing key"; exit 1; }
          chmod 600 signingkey.jks

      - name: Build signed release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEY_STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$ALIAS" ]] || {
            echo "Missing release signing secrets"
            exit 1
          }
          ./gradlew :src:zh:manhuagui:assembleRelease --no-daemon

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(src/zh/manhuagui/build/outputs/apk/release/*.apk)
          [[ "${#apks[@]}" -eq 1 ]] || { echo "Expected exactly one release APK"; exit 1; }
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$apksigner_path" ]] || { echo "Android apksigner not found"; exit 1; }
          "$apksigner_path" verify --verbose "${apks[0]}"

      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f signingkey.jks

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(src/zh/manhuagui/build/outputs/apk/release/*.apk)
          [[ "${#apks[@]}" -eq 1 ]] || { echo "Release APK not found"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${apks[0]}" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
