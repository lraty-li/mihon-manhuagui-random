name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: ./gradlew :src:zh:manhuagui:assembleDebug --no-daemon
      - name: Upload temporary Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manhuagui-random-debug
          path: src/zh/manhuagui/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
